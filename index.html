<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#86ceff" />
    <meta
      name="description"
      content="Информационный центр Управления ветеринарии Ленинградской области. От цифровой отчётности к управлению на основе данных."
    />
    <title>Информационный центр · Управление ветеринарии Ленинградской области</title>
    <link rel="preload" href="assets/landscape.webp?v=2" as="image" />
    <link rel="preload" href="assets/map.webp?v=5" as="image" />
    <link rel="stylesheet" href="style.css?v=8" />
    <script src="app.js?v=7" defer></script>
  </head>
  <body>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <main id="experience" aria-label="Информационный центр — интерактивная презентация"></main>
    <nav class="toolbar" aria-label="Навигация презентации">
      <a class="identity" href="#s1"
        ><span class="identity-dot"></span>Информационный центр
        <span class="region">· Ленинградская область</span></a
      >
      <div class="controls">
        <button id="prev" aria-label="Предыдущий экран">←</button
        ><output id="counter" aria-live="polite">01 / 24</output
        ><button id="next" aria-label="Следующий экран">→</button><span class="divider"></span
        ><button id="overview-button" aria-label="Обзор всех экранов" title="Обзор · O">▦</button

      </div>
    </nav>
    <dialog id="overview" aria-labelledby="overview-title">
      <div class="overview-header">
        <div>
          <small>ИНФОРМАЦИОННЫЙ ЦЕНТР</small>
          <h2 id="overview-title">Весь проект · 24 экрана</h2>
        </div>
        <button id="close-overview" aria-label="Закрыть обзор">✕</button>
      </div>
      <div id="overview-grid"></div>
    </dialog>
    <div id="notice" role="status"></div>
    <noscript>Для интерактивной презентации включите JavaScript в браузере.</noscript>
