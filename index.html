 замечания → доработка Акта ВСО · Управление → запрос → «Причины выбытия»"}, {"k": "question", "ey": "25 · ВОПРОС К ЗАЛУ", "t": "Какую ручную работу мы должны убрать следующей?", "items": ["Какие данные вводите несколько раз?", "Какой отчёт занимает больше всего времени?", "Что собираете по телефону и почте?", "Какой контроль ведётся вручную?", "Где руководителю не хватает информации?", "Что в системе сейчас необходимо изменить?"]}, {"k": "final", "ey": "26 · ФИНАЛ", "t": "Ветеринарная служба уже работает.", "sub": "Наша задача — дать ей инструменты, которые помогают работать быстрее и видеть больше.", "foot": "ФЕРМА → СББЖ → УПРАВЛЕНИЕ → ДАННЫЕ → РЕШЕНИЕ"}];const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const deck=document.getElementById('deck');function head(s){let t=E(s.t);let parts=t.split(' — ');if(parts.length>1)t=E(parts.shift())+' — <span class="blue">'+E(parts.join(' — '))+'</span>';return `<div class="ey">${E(s.ey||'')}</div><h1 class="h">${t}</h1>${s.sub?`<div class="sub">${E(s.sub)}</div>`:''}`}
function simpleCards(items){return `<div class="cards">${items.map(x=>{let [a,b='']=x.split('|');return `<div class="card"><b>${E(a)}</b><p>${E(b)}</p></div>`}).join('')}</div>`}
function network(s){return `<div class="network"><svg viewBox="0 0 1000 650" preserveAspectRatio="none"><path d="M110 120 C300 160 340 260 500 325"/><path d="M890 120 C700 160 660 260 500 325"/><path d="M110 530 C300 490 340 390 500 325"/><path d="M890 530 C700 490 660 390 500 325"/></svg><div class="node">⚙</div><div class="node">▰</div><div class="node">↗</div><div class="node">AI</div><div class="core">DATA</div></div>`}
function render(s,i){let v='';if(s.k==='hero')v=network(s);else if(s.k==='hub')v=network(s);else if(['cards','roadmap','integrations','chat','demo','loop'].includes(s.k))v=simpleCards(s.items);else if(s.k==='timeline'||s.k==='ai')v=`<div class="timeline">${s.items.map((x,j)=>`<div class="step"><div class="num">${j+1}</div><b>${E(x)}</b></div>`).join('')}</div>`;else if(s.k==='metric')v=`<div class="metricBox"><div class="list">${s.items.map(x=>`<div class="listItem">${E(x)}</div>`).join('')}</div><div class="bigMetric glass"><b>${E(s.big)}</b></div></div>`;else if(['shift','input','features','manual','question'].includes(s.k)){let its=s.items||[];v=`<div class="${s.k==='question'?'questionGrid':'pillGrid'}">${its.map(x=>s.k==='question'?`<div class="q">${E(x)}</div>`:`<div class="pill">${E(x)}</div>`).join('')}</div>${s.big?`<div class="statRow"><div class="stat"><b>${E(s.big)}</b><div>рабочего времени</div></div></div>`:''}`}else if(s.k==='pipeline')v=`<div class="pipe">${s.items.map(x=>{let[a,b]=x.split('|');return `<div class="card"><div><span class="tag">${E(a)}</span><p>${E(b)}</p></div><div class="mock"></div></div>`}).join('')}</div>`;else if(s.k==='dashboard')v=`<div class="dashgrid">${s.items.map(x=>`<div class="dash"><b>${E(x)}</b><div class="chart"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>`).join('')}</div>`;else if(['compare','economy'].includes(s.k))v=`<div class="compare"><div class="col glass before"><h3>${s.k==='economy'?'Потенциальный ущерб':'Было'}</h3><div class="route">${s.before.map(x=>`<span>${E(x)}</span>`).join('')}</div></div><div class="col glass after"><h3>${s.k==='economy'?'Роль цифрового контура':'Стало'}</h3><div class="route">${s.after.map(x=>`<span>${E(x)}</span>`).join('')}</div></div></div>`;else if(s.k==='table')v=`<table class="table"><tr><th>Предотвращённое выбытие</th><th>Условная стоимость</th></tr>${s.rows.map(r=>`<tr><td>${E(r[0])}</td><td>${E(r[1])}</td></tr>`).join('')}</table>`;else if(s.k==='story')v=`<div class="list">${s.items.map(x=>`<div class="listItem">${E(x)}</div>`).join('')}</div>`;else if(s.k==='final')v=`<div class="glass" style="padding:28px;max-width:800px"><div style="font-size:18px;color:#dff7ff">Спасибо за совместную работу</div><div style="margin-top:18px;font-size:28px;font-weight:900">${E(s.foot||'')}</div></div>`;let cl=s.k==='final'?'scene finalScene':'scene';let foot=s.foot&&s.k!=='final'?`<div class="footer fade delay">${E(s.foot)}</div>`:'';let single=['timeline','metric','shift','input','features','manual','pipeline','dashboard','compare','economy','table','demo','integrations','ai','chat','roadmap','loop','question','story','final'].includes(s.k);return `<section class="${cl}" id="s${i+1}"><div class="wrap ${single?'single':''}"><div class="copy fade">${head(s)}</div><div class="visual fade delay">${v}</div></div>${foot}</section>`}
deck.innerHTML=S.map(render).join('');const dots=document.getElementById('dots');S.forEach((s,i)=>{let b=document.createElement('button');b.onclick=()=>go(i);dots.appendChild(b)});const ovg=document.getElementById('ovgrid');S.forEach((s,i)=>{let x=document.createElement('div');x.className='ovitem';x.innerHTML=`<small>${String(i+1).padStart(2,'0')}</small><b>${E(s.t)}</b>`;x.onclick=()=>{document.getElementById('ov').classList.remove('open');go(i)};ovg.appendChild(x)});let cur=0;const secs=[...document.querySelectorAll('.scene')],ds=[...dots.children];const count=document.getElementById('count'),prog=document.getElementById('prog');function active(i){cur=i;secs.forEach((s,j)=>s.classList.toggle('active',i===j));ds.forEach((d,j)=>d.classList.toggle('on',i===j));count.textContent=`${String(i+1).padStart(2,'0')} / ${S.length}`;prog.style.width=`${(i+1)/S.length*100}%`}function go(i){i=Math.max(0,Math.min(S.length-1,i));secs[i].scrollIntoView({behavior:'smooth'})}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.58)active(secs.indexOf(e.target))}),{root:deck,threshold:[.58]});secs.forEach(s=>io.observe(s));document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);document.getElementById('ovb').onclick=()=>document.getElementById('ov').classList.add('open');document.getElementById('close').onclick=()=>document.getElementById('ov').classList.remove('open');document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key.toLowerCase()==='o')document.getElementById('ovb').click();if(e.key.toLowerCase()==='f')document.getElementById('fs').click()});active(0);
